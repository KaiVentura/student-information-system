<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <style>
        /* CSS STYLING */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        /* Form Styling */
        .form-container {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input, select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 200px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .btn-delete {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 14px;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #777;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to our Student Information System Laboratory Project</h1>

        <!-- Add Student Form -->
        <div class="form-container">
            <form id="studentForm">
                <div class="form-group">
                    <input type="text" id="studentId" placeholder="Student ID (e.g., 2024-001)" required>
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="text" id="course" placeholder="Course (e.g., BSCS, BSIT)" required>
                    <select id="yearLevel" required>
                        <option value="" disabled selected>Select Year Level</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>
                <button type="submit">Add Student</button>
            </form>
        </div>

        <!-- Student Data Table -->
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Full Name</th>
                    <th>Course</th>
                    <th>Year Level</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- JavaScript will inject rows here -->
            </tbody>
        </table>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Array to hold student data. We load from localStorage if it exists.
        let students = JSON.parse(localStorage.getItem('students')) || [];

        const studentForm = document.getElementById('studentForm');
        const tableBody = document.getElementById('studentTableBody');

        // Function to display the students in the table
        function renderTable() {
            tableBody.innerHTML = ''; // Clear current table

            if (students.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">No students found. Add a student above.</td></tr>';
                return;
            }

            // Loop through the students array and create a row for each
            students.forEach((student, index) => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.course}</td>
                    <td>${student.year}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent(${index})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Function to add a new student
        studentForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page refresh on submit

            // Get values from the form
            const newStudent = {
                id: document.getElementById('studentId').value,
                name: document.getElementById('fullName').value,
                course: document.getElementById('course').value.toUpperCase(),
                year: document.getElementById('yearLevel').value
            };

            // Add to array and save
            students.push(newStudent);
            saveData();
            renderTable();

            // Clear the form fields
            studentForm.reset();
        });

        // Function to delete a student
        function deleteStudent(index) {
            if(confirm('Are you sure you want to delete this student?')) {
                students.splice(index, 1); // Remove 1 item at the given index
                saveData();
                renderTable();
            }
        }

        // Function to save data to the browser's Local Storage
        function saveData() {
            localStorage.setItem('students', JSON.stringify(students));
        }

        // Initial render when the page loads
        renderTable();
    </script>

</body>
</html>
